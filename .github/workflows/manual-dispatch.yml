name: Manual Dispatch Workflow

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target Build / Action'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - apk
          - appbundle
          - all

      resumeUrl:
        description: 'URL callback otomatis dari n8n'
        required: false
        type: string

jobs:
  build:
    name: Run ${{ inputs.build_target }}
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Error Log
        run: touch error.log

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install Dependencies
        id: dependencies
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a error.log

      - name: Analyze Project
        id: analyze
        if: always() && steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee -a error.log

      - name: Run Tests
        id: tests
        if: always() && steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a error.log

      - name: Build Android APK
        id: apk
        if: always() && (inputs.build_target == 'apk' || inputs.build_target == 'all') && steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee -a error.log

      - name: Build Android App Bundle
        id: appbundle
        if: always() && (inputs.build_target == 'appbundle' || inputs.build_target == 'all') && steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build appbundle --release 2>&1 | tee -a error.log

      - name: Upload APK Artifact
        if: always() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Upload App Bundle Artifact
        if: always() && steps.appbundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Notify n8n / Resume Workflow
        if: always()
        env:
          TARGET_URL: ${{ inputs.resumeUrl }}
          BUILD_TARGET: ${{ inputs.build_target }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          APK_OUTCOME: ${{ steps.apk.outcome }}
          APPBUNDLE_OUTCOME: ${{ steps.appbundle.outcome }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "resumeUrl is empty. Skipping callback."
            exit 0
          fi

          STATUS="success"

          if [ "$DEPENDENCIES_OUTCOME" = "failure" ] || \
             [ "$ANALYZE_OUTCOME" = "failure" ] || \
             [ "$TEST_OUTCOME" = "failure" ]; then
            STATUS="failed"
          fi

          if { [ "$BUILD_TARGET" = "apk" ] || [ "$BUILD_TARGET" = "all" ]; } && \
             [ "$APK_OUTCOME" = "failure" ]; then
            STATUS="failed"
          fi

          if { [ "$BUILD_TARGET" = "appbundle" ] || [ "$BUILD_TARGET" = "all" ]; } && \
             [ "$APPBUNDLE_OUTCOME" = "failure" ]; then
            STATUS="failed"
          fi

          if [ "$STATUS" = "failed" ]; then
            ERROR="$(tail -n 100 error.log)"
          else
            ERROR="No errors detected."
          fi

          jq -n \
            --arg status "$STATUS" \
            --arg error "$ERROR" \
            --arg workflow "${{ github.workflow }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_number "${{ github.run_number }}" \
            --arg build_target "$BUILD_TARGET" \
            --arg actor "${{ github.actor }}" \
            --arg repository "${{ github.repository }}" \
            --arg html_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              status: $status,
              error: $error,
              workflow: $workflow,
              run_id: $run_id,
              run_number: $run_number,
              build_target: $build_target,
              actor: $actor,
              repository: $repository,
              html_url: $html_url
            }' |
          curl --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            --max-time 30 \
            -X POST "$TARGET_URL" \
            -H "Content-Type: application/json" \
            --data-binary @-
